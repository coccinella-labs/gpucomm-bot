---
name: GPU CI

on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  normalize-title:
    # GitHub Actions has no toLower function. Normalize the PR title on a
    # hosted runner so the GPU job condition remains valid.
    runs-on: ubuntu-latest
    outputs:
      is_gpu: ${{ steps.check.outputs.is_gpu }}
    steps:
      - id: check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          lowered="$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]')"
          if [[ "$lowered" == *gpu* || "$lowered" == *cuda* ]]; then
            echo "is_gpu=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_gpu=false" >> "$GITHUB_OUTPUT"
          fi

  gpu-check:
    # Real GPU validation needs a self-hosted NVIDIA runner
    # with the CUDA toolkit installed.
    # Recommended runner labels: self-hosted, linux, x64, gpu
    #
    # Avoid queueing GPU jobs unless a matching
    # GPU runner is online.
    # The bot can apply a label like `gpu-required` to trigger this job.
    needs: normalize-title
    if: |
      contains(
        join(github.event.pull_request.labels.*.name, ','),
        'gpu-required'
      ) || needs.normalize-title.outputs.is_gpu == 'true'
    runs-on: [self-hosted, linux, x64, gpu]

    steps:
      - uses: actions/checkout@v4

      - name: GPU + CUDA smoke tests (nvcc)
        run: bash scripts/gpu-ci.sh

      - name: PyTorch CUDA smoke test
        env:
          # Set this to the correct wheel index for your runner/toolkit, e.g.
          # https://download.pytorch.org/whl/cu121
          PYTORCH_INDEX_URL: ${{ vars.PYTORCH_INDEX_URL }}
        run: bash scripts/gpu-ci.sh pytorch
